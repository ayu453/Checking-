<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">IMAX 3D Simulator — Your Immersive Virtual Cinema</title>
<desc id="desc">A cinematic dark theatre with a glowing widescreen and IMAX 3D Simulator branding.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset=".55" stop-color="#08090d"/><stop offset="1" stop-color="#170711"/></linearGradient>
  <radialGradient id="redGlow"><stop stop-color="#ef334f" stop-opacity=".42"/><stop offset="1" stop-color="#ef334f" stop-opacity="0"/></radialGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff4ed"/><stop offset=".32" stop-color="#ff7b79"/><stop offset="1" stop-color="#7f102c"/></linearGradient>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff6476"/><stop offset="1" stop-color="#650b20"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="36"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
